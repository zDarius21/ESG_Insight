# ESG Insight: frontend React + backend Express + motore AI Django, con PostgreSQL e MinIO.
# Avvio: copiare .env.example in .env, poi `docker compose up --build` e aprire http://localhost:8080
services:
  # SPA React servita da nginx, che inoltra /api al backend
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

  # API REST: autenticazione JWT, utenti, token, normative, documenti, analisi e report
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - AI_ENGINE_URL=http://ai-engine:8000
      # Fuso orario delle date stampate nei report PDF
      - TZ=${TZ:-Europe/Rome}
    depends_on:
      keygen:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-engine:
        condition: service_started
    volumes:
      - ./backend/keys:/usr/src/app/keys:ro

  # Genera al primo avvio la coppia di chiavi RSA per i JWT (se sono già presenti non fa nulla)
  keygen:
    image: node:20-alpine
    volumes:
      - ./backend/scripts:/scripts:ro
      - ./backend/keys:/keys
    command: ["node", "/scripts/generate-keys.js", "/keys"]

  # Motore di analisi AI: raggiungibile solo dal backend, non esposto all'esterno
  ai-engine:
    build: ./ai-engine
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=ai-engine,localhost,127.0.0.1
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
      - LOCAL_LLM_FALLBACK_MODEL=${LOCAL_LLM_FALLBACK_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      - LOCAL_LLM_MAX_NEW_TOKENS=${LOCAL_LLM_MAX_NEW_TOKENS:-512}
      - MAX_SEMANTIC_EVALUATIONS=${MAX_SEMANTIC_EVALUATIONS:-2}
      - AI_PRELOAD_MODELS=true
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      # Cache dei modelli Hugging Face: scaricati solo al primo avvio
      - ai_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  ai_models:
