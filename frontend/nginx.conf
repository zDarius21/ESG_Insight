# Serve la build React e inoltra /api al backend Express (stessa origine: niente CORS)
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # I PDF caricati arrivano fino a 10 MB (limite del backend)
    client_max_body_size 20m;

    location /api/ {
        # Lo slash finale rimuove il prefisso: /api/documents -> http://backend:3000/documents
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le analisi AI possono richiedere alcuni minuti
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
